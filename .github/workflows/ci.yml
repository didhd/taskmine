name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    # A pull request from a branch of this repository is already tested by the push of that branch.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          # macOS minutes cost 10x on a private repository: one Python version there.
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"  # the end-to-end and text-probe tests run node:test
      - name: botocore, for the gateway signer test (it skips without it)
        run: python -m pip install botocore
      - name: Tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  lint:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.17.6
      - name: ruff (configuration in pyproject.toml)
        run: ruff check --output-format github .

  build:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install build==1.6.1
      - name: Build the sdist and the wheel
        run: python -m build
      - name: The wheel and the sdist carry every package file (templates, agentcore/)
        run: python scripts/release.py check-dist dist
      - name: CLI smoke run from the installed wheel
        run: |
          want="taskmine $(python scripts/release.py version)"
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install --quiet dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke/bin/python" -m taskmine --help
          "$RUNNER_TEMP/smoke/bin/taskmine" --help > /dev/null
          test "$("$RUNNER_TEMP/smoke/bin/python" -m taskmine --version)" = "$want"
          test "$("$RUNNER_TEMP/smoke/bin/taskmine" --version)" = "$want"
          echo "$want"
